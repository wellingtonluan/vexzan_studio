<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Redirecionando...</title>

<style>

body{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:#050505;
color:white;
font-family:Arial,sans-serif;
margin:0;
text-align:center;
}

.box{
padding:40px;
border-radius:20px;
background:#111;
border:1px solid #222;
max-width:450px;
}

.loader{
width:45px;
height:45px;
border:4px solid #333;
border-top:4px solid #d4af37;
border-radius:50%;
margin:20px auto;
animation:spin 1s linear infinite;
}

@keyframes spin{
100%{
transform:rotate(360deg);
}
}

</style>
</head>

<body>

<div class="box">

<h2>Redirecionando para o pagamento...</h2>

<div class="loader"></div>

<p>Aguarde alguns segundos.</p>

</div>

<script>

setTimeout(()=>{

window.location.href="https://buy.stripe.com/6oUeV57jR0Ptbbr5Gv6kg03";

},2000);

</script>

</body>
</html>
